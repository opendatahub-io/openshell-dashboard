apiVersion: v1
kind: Service
metadata:
  name: {{ include "dashboard.fullname" . }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ if eq .Values.auth.mode "oauth2-proxy" }}proxy{{ else }}http{{ end }}
  selector:
    {{- include "dashboard.selectorLabels" . | nindent 4 }}
